<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PVP Hub</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;600;700;800&display=swap');
    :root { --ink:#f7f8fb; --muted:#9299ab; --line:#29303e; --panel:#151a24; --row:#1b212d; --gold:#f4ad36; --bg:#090c12; }
    * { box-sizing:border-box; } [hidden] { display:none !important; } body { margin:0; color:var(--ink); background:radial-gradient(circle at 85% -10%, #283347 0, transparent 32%), var(--bg); font:14px Manrope, sans-serif; }
    a { color:inherit; text-decoration:none; } button, input, textarea { font:inherit; } button { cursor:pointer; }
    header { height:72px; display:flex; align-items:center; gap:34px; padding:0 max(22px, calc((100% - 1180px)/2)); border-bottom:1px solid var(--line); background:#0d1119e8; }
    .logo { color:var(--gold); font:700 30px 'Barlow Condensed', sans-serif; letter-spacing:.5px; text-transform:uppercase; }
    nav { display:flex; gap:22px; color:var(--muted); font-weight:700; } nav a:first-child { color:var(--ink); }
    .account { margin-left:auto; display:flex; gap:10px; align-items:center; color:var(--muted); font-size:12px; }
    .btn { border:1px solid var(--line); border-radius:4px; padding:9px 13px; background:#202735; color:var(--ink); font-weight:800; } .btn:hover { border-color:var(--gold); } .btn.gold { background:var(--gold); border-color:var(--gold); color:#17120a; }
    main { width:min(1180px, calc(100% - 28px)); margin:34px auto 60px; } .intro { display:flex; align-items:end; justify-content:space-between; margin-bottom:20px; } h1 { margin:0; font:700 44px 'Barlow Condensed', sans-serif; text-transform:uppercase; letter-spacing:.6px; } .intro p { margin:5px 0 0; color:var(--muted); }
    .panel { overflow:hidden; border:1px solid var(--line); border-radius:7px; background:var(--panel); box-shadow:0 18px 50px #0005; }
    .tabs { display:flex; overflow:auto; background:#111620; border-bottom:1px solid var(--line); } .tab { min-width:92px; padding:15px 12px; border:0; border-bottom:2px solid transparent; background:transparent; color:var(--muted); font-weight:800; white-space:nowrap; } .tab.active { border-bottom-color:var(--gold); color:var(--ink); }
    .table-head, .player-row { display:grid; grid-template-columns:70px minmax(250px, 1.2fr) 90px minmax(350px, 2fr); align-items:center; gap:14px; } .table-head { padding:13px 20px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--line); } .player-row { min-height:72px; padding:12px 20px; background:var(--row); border-bottom:1px solid var(--line); } .player-row:hover { background:#222a38; }
    .rank { color:var(--gold); font:700 25px 'Barlow Condensed', sans-serif; } .identity { display:flex; align-items:center; gap:13px; } .avatar { width:40px; height:40px; border-radius:4px; image-rendering:pixelated; background:#303746; } .name { font-weight:800; } .player-link { padding:0; border:0; background:transparent; color:var(--ink); font-weight:800; text-align:left; } .player-link:hover { color:var(--gold); } .title { margin-top:3px; color:var(--muted); font-size:11px; } .region { justify-self:start; padding:4px 8px; border:1px solid #56352e; border-radius:3px; color:#ff917a; background:#321e1e; font-size:11px; font-weight:800; } .tiers { display:flex; flex-wrap:wrap; gap:12px; } .tier { min-width:28px; text-align:center; color:var(--gold); font:700 12px 'Barlow Condensed', sans-serif; } .tier small { display:block; margin-bottom:3px; color:var(--muted); font:11px Manrope, sans-serif; }
    .tier-grid { display:grid; grid-template-columns:repeat(5, 1fr); } .tier-col { min-width:0; border-right:1px solid var(--line); } .tier-col:last-child { border:0; } .tier-header { padding:14px; text-align:center; font:700 18px 'Barlow Condensed', sans-serif; text-transform:uppercase; } .tier-col:nth-child(1) .tier-header { background:#9a7012; } .tier-col:nth-child(2) .tier-header { background:#626c7c; } .tier-col:nth-child(3) .tier-header { background:#89502d; } .tier-col:nth-child(4) .tier-header { background:#3e68a7; } .tier-col:nth-child(5) .tier-header { background:#454b58; } .tier-entry { display:flex; align-items:center; gap:8px; min-height:49px; padding:9px 12px; border-bottom:1px solid var(--line); background:var(--row); font-size:12px; font-weight:700; } .tier-entry .avatar { width:25px; height:25px; } .tier-entry .player-link { font-size:12px; } .high { margin-left:auto; color:var(--gold); font-size:9px; } .empty { padding:18px 12px; color:var(--muted); font-style:italic; font-size:12px; }
    .modal { position:fixed; inset:0; display:grid; place-items:center; padding:20px; background:#0009; } .modal[hidden] { display:none; } .dialog { width:min(760px, 100%); max-height:90vh; overflow:auto; padding:24px; border:1px solid var(--line); border-radius:7px; background:#151a24; } .profile-dialog { width:min(680px, 100%); } .dialog h2 { margin:0 0 18px; font:700 28px 'Barlow Condensed', sans-serif; text-transform:uppercase; } label { display:block; margin:12px 0 6px; color:var(--muted); font-size:12px; font-weight:800; } input, textarea, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:4px; outline:0; background:#0d1119; color:var(--ink); } textarea { min-height:250px; resize:vertical; font:12px Consolas, monospace; } .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; } .message { min-height:18px; margin-top:10px; color:#ff917a; font-size:12px; } .message.success { color:#9bd89b; } .field-actions { display:flex; gap:7px; } .field-actions input { flex:1; } .editor-row { display:grid; grid-template-columns:1fr 2fr auto; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); } .reset-form { display:flex; gap:6px; } .reset-form input { padding:7px; } .player-editor { margin:12px 0; padding:14px; border:1px solid var(--line); border-radius:5px; background:#111620; } .player-editor-head { display:flex; align-items:center; justify-content:space-between; gap:10px; } .player-editor-head strong { color:var(--gold); } .player-fields { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:8px; } .player-fields label { margin-top:10px; } .player-fields input { padding:8px; } .sort-option { display:flex; align-items:center; gap:8px; margin:16px 0 4px; color:var(--ink); font-size:12px; } .sort-option input { width:auto; } .advanced { margin-top:14px; color:var(--muted); font-size:12px; } .advanced summary { cursor:pointer; color:var(--ink); font-weight:800; } .advanced textarea { margin-top:10px; min-height:160px; } .profile-head { display:flex; align-items:center; gap:14px; padding-bottom:18px; border-bottom:1px solid var(--line); } .profile-head .avatar { width:64px; height:64px; } .profile-subtitle { margin-top:4px; color:var(--muted); } .profile-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin:18px 0; } .profile-stat { padding:13px; border:1px solid var(--line); border-radius:4px; background:#111620; } .profile-stat strong { display:block; color:var(--gold); font:700 24px 'Barlow Condensed', sans-serif; } .profile-stat span { color:var(--muted); font-size:11px; } .profile-tiers { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; } .profile-tier { padding:9px; border:1px solid var(--line); border-radius:4px; background:#111620; } .profile-tier span { display:block; color:var(--muted); font-size:11px; } .profile-tier strong { color:var(--gold); }
    @media (max-width:760px) { header { gap:18px; } nav { display:none; } .intro { display:block; } h1 { font-size:38px; } .table-head { display:none; } .player-row { grid-template-columns:42px 1fr; gap:10px; } .region, .tiers { grid-column:2; } .tiers { gap:8px; } .tier-grid { grid-template-columns:1fr 1fr; } .tier-col:nth-child(5) { grid-column:1 / -1; } .account span { display:none; } }
  </style>
</head>
<body>
  <header><a class="logo" href="/">PVP Hub</a><nav><a href="/">Rankings</a><a href="https://discord.gg/k3dBCPnJ6K">Discord</a></nav><div class="account" id="account"><button class="btn" id="login-button">Sign in</button></div></header>
  <main><div class="intro"><div><h1>Combat rankings</h1><p>Live player tiers, backed by the PVP Hub data store.</p></div><button class="btn" id="manage-button" hidden>Manage</button></div>
    <section class="panel"><div class="tabs" id="tabs"></div><div id="overall"><div class="table-head"><div>#</div><div>Player</div><div>Region</div><div>Tiers</div></div><div id="players"></div></div><div class="tier-grid" id="tier-grid" hidden></div></section>
  </main>
  <div class="modal" id="login-modal" hidden><form class="dialog" id="login-form"><h2>Sign in</h2><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div class="message" id="login-message"></div><div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn gold">Sign in</button></div></form></div>
  <div class="modal" id="profile-modal" hidden><div class="dialog profile-dialog"><div id="profile-content"></div><div class="actions"><button class="btn" data-close>Close</button></div></div></div>
  <div class="modal" id="manage-modal" hidden><div class="dialog"><h2 id="manage-title">Editor workspace</h2><div id="editor-management" hidden><h3>Account management</h3><form id="admin-password-form"><label for="current-admin-password">Current admin password</label><input id="current-admin-password" type="password" autocomplete="current-password" required><label for="new-admin-password">New admin password</label><input id="new-admin-password" type="password" minlength="8" autocomplete="new-password" required><div class="actions"><button class="btn gold">Change admin password</button></div></form><form id="editor-form"><h3>Add editor</h3><label for="new-username">Username</label><input id="new-username" placeholder="e.g. tournament_editor" autocomplete="off" required><label for="new-password">Temporary password</label><div class="field-actions"><input id="new-password" type="password" minlength="8" autocomplete="new-password" required><button type="button" class="btn" id="generate-password">Generate</button><button type="button" class="btn" id="toggle-password">Show</button></div><div class="actions"><button class="btn gold">Add editor</button></div></form><div id="editor-list"></div></div><div class="actions"><button type="button" class="btn gold" id="add-player">Add player</button></div><label class="sort-option"><input id="sort-by-points" type="checkbox" checked> Automatically order players by points</label><div id="player-editor-list"></div><details class="advanced"><summary>Advanced: edit raw JSON</summary><textarea id="data-editor" spellcheck="false"></textarea></details><div class="message" id="manage-message"></div><div class="actions"><button class="btn" data-close>Close</button><button class="btn gold" id="save-data">Copy JSON for repo</button></div></div></div>
  <script>
    const modes = { overall: ["Overall", "🏆"], ltms: ["LTMs", "⚔"], vanilla: ["Vanilla", "◆"], uhc: ["UHC", "♥"], pot: ["Pot", "◈"], nethop: ["NethOP", "✦"], smp: ["SMP", "◎"], sword: ["Sword", "⚔"], axe: ["Axe", "⌁"], mace: ["Mace", "◆"] };
    const modeKeys = ["sword", "axe", "mace", "uhc", "nethop", "pot", "smp", "vanilla"]; const tierPoints = { LT1:45, HT1:60, LT2:20, HT2:30, LT3:6, HT3:10, LT4:3, HT4:4, LT5:1, HT5:2 }; let data = { players: [] }; let currentMode = "overall"; let currentUser = null;
    const $ = selector => document.querySelector(selector); const esc = value => String(value).replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char]));
    function calculatePoints(player) { return modeKeys.reduce((total, mode) => total + (player[mode] && !player[mode].startsWith("R-") ? tierPoints[player[mode]] || 0 : 0), 0); }
    function calculateAverageRank(player) { const ranks = modeKeys.map(mode => player[mode]).filter(value => value && value !== "-" && !value.startsWith("R-")).map(value => (Number(value.slice(2)) - 1) * 2 + (value.startsWith("LT") ? 2 : 1)); if (!ranks.length) return "-"; const average = Math.round(ranks.reduce((total, rank) => total + rank, 0) / ranks.length); return (average % 2 ? "HT" : "LT") + Math.ceil(average / 2); }
    function recalculatePoints() { data.players.forEach(player => { player.points = calculatePoints(player); }); }
    async function api(url, options) { const response = await fetch(url, { headers: { "Content-Type":"application/json" }, ...options }); const result = await response.json().catch(() => ({})); if (!response.ok) throw Error(result.error || `Request failed (${response.status})`); return result; }
    function renderTabs() { $("#tabs").innerHTML = Object.entries(modes).map(([key, [label, icon]]) => `<button class="tab ${key === currentMode ? "active" : ""}" data-mode="${key}">${icon} ${label}</button>`).join(""); }
    function renderOverall() { $("#overall").hidden = currentMode !== "overall"; $("#tier-grid").hidden = currentMode === "overall"; if (currentMode !== "overall") return renderTiers(); $("#players").innerHTML = data.players.map((player, index) => `<div class="player-row"><div class="rank">${index + 1}.</div><div class="identity"><img class="avatar" src="https://mc-heads.net/avatar/${encodeURIComponent(player.name)}/40" alt=""><div><button class="player-link" data-player-name="${esc(player.name)}">${esc(player.name)}</button><div class="title">✦ ${esc(player.title || "Player")} (${calculatePoints(player)} points)</div></div></div><div class="region">${esc(player.region || "--")}</div><div class="tiers">${modeKeys.map(mode => `<div class="tier"><small>${modes[mode][1]}</small>${esc(player[mode] || "-")}</div>`).join("")}</div></div>`).join(""); }
    function renderTiers() { const columns = [1,2,3,4,5].map(tier => { const entries = data.players.filter(player => { const value = player[currentMode]; return value && value !== "-" && !value.startsWith("R-") && Number(value.slice(2)) === tier; }).sort((a,b) => Number(b[currentMode].startsWith("HT")) - Number(a[currentMode].startsWith("HT"))); return `<div class="tier-col"><div class="tier-header">Tier ${tier}</div>${entries.length ? entries.map(player => `<div class="tier-entry"><img class="avatar" src="https://mc-heads.net/avatar/${encodeURIComponent(player.name)}/24" alt=""><button class="player-link" data-player-name="${esc(player.name)}">${esc(player.name)}</button>${player[currentMode].startsWith("HT") ? "<span class=high>HIGH</span>" : ""}</div>`).join("") : "<div class=empty>No players</div>"}</div>`; }); $("#tier-grid").innerHTML = columns.join(""); }
    function renderAccount() { $("#account").innerHTML = currentUser ? `<span>${esc(currentUser.username)} · ${currentUser.role}</span><button class="btn" id="logout-button">Sign out</button>` : `<button class="btn" id="login-button">Sign in</button>`; $("#manage-button").hidden = !currentUser; }
    async function loadEditors() { const accounts = await api("/api/accounts"); $("#editor-list").innerHTML = accounts.length ? accounts.map(account => `<div class="editor-row"><span>${esc(account.username)} <small>${esc(account.role)}</small></span><form class="reset-form" data-reset-password="${esc(account.username)}"><input type="password" minlength="8" placeholder="New password" required><button class="btn">Reset</button></form>${account.role === "editor" ? `<button class="btn" data-remove="${esc(account.username)}">Remove</button>` : "<span></span>"}</div>`).join("") : "<p class=empty>No accounts yet.</p>"; }
    const tierOptions = ["-", ...["HT", "LT"].flatMap(prefix => [1, 2, 3, 4, 5].map(tier => prefix + tier)), ...["HT", "LT"].flatMap(prefix => [1, 2, 3, 4, 5].map(tier => "R-" + prefix + tier))];
    function tierSelect(mode, index, value) { return `<label>${modes[mode][0]}<select data-player="${index}" data-field="${mode}">${tierOptions.map(option => `<option value="${option}" ${option === value ? "selected" : ""}>${option}</option>`).join("")}</select></label>`; }
    function renderPlayerEditors() { $("#player-editor-list").innerHTML = data.players.map((player, index) => `<div class="player-editor"><div class="player-editor-head"><strong>Player ${index + 1}</strong><button type="button" class="btn" data-remove-player="${index}">Remove</button></div><div class="player-fields"><label>Name<input data-player="${index}" data-field="name" value="${esc(player.name || "")}" required></label><label>Region<input data-player="${index}" data-field="region" value="${esc(player.region || "US")}"></label><label>Title<input data-player="${index}" data-field="title" value="${esc(player.title || "Player")}"></label><label>Points<input data-player="${index}" data-field="points" type="number" value="${calculatePoints(player)}" readonly></label>${modeKeys.map(mode => tierSelect(mode, index, player[mode] || "-")).join("")}</div></div>`).join(""); }
    function sortPlayersByPoints() { data.players = data.players.map((player, index) => ({ player, index })).sort((a, b) => (Number(b.player.points) || 0) - (Number(a.player.points) || 0) || a.index - b.index).map(entry => entry.player); }
    function openManage() { $("#manage-modal").hidden = false; $("#data-editor").value = JSON.stringify(data, null, 2); renderPlayerEditors(); $("#editor-management").hidden = currentUser.role !== "master"; $("#manage-message").textContent = ""; if (currentUser.role === "master") loadEditors(); }
    function openProfile(name) { const player = data.players.find(entry => entry.name === name); if (!player) return; const tested = modeKeys.filter(mode => player[mode] && player[mode] !== "-" && !player[mode].startsWith("R-")).length; $("#profile-content").innerHTML = `<div class="profile-head"><img class="avatar" src="https://mc-heads.net/avatar/${encodeURIComponent(player.name)}/64" alt=""><div><h2>${esc(player.name)}</h2><div class="profile-subtitle">${esc(player.title || "Player")} · ${esc(player.region || "--")}</div></div></div><div class="profile-stats"><div class="profile-stat"><strong>${calculatePoints(player)}</strong><span>Overall points</span></div><div class="profile-stat"><strong>${tested}</strong><span>Tested modes</span></div><div class="profile-stat"><strong>${calculateAverageRank(player)}</strong><span>Average rank</span></div></div><h3>Combat tiers</h3><div class="profile-tiers">${modeKeys.map(mode => `<div class="profile-tier"><span>${modes[mode][0]}</span><strong>${esc(player[mode] || "-")}</strong></div>`).join("")}</div>`; $("#profile-modal").hidden = false; }
    $("#tabs").addEventListener("click", event => { const tab = event.target.closest(".tab"); if (!tab) return; currentMode = tab.dataset.mode; renderTabs(); renderOverall(); });
    document.addEventListener("click", async event => { if (event.target.dataset.playerName) openProfile(event.target.dataset.playerName); if (event.target.id === "login-button") $("#login-modal").hidden = false; if (event.target.id === "logout-button") { await api("/api/logout", { method:"POST" }); currentUser = null; renderAccount(); } if (event.target.id === "manage-button") openManage(); if (event.target.id === "add-player") { data.players.push({ name:"NewPlayer", region:"US", title:"Player", points:0, ...Object.fromEntries(modeKeys.map(mode => [mode, "-"])) }); renderPlayerEditors(); } if (event.target.id === "sort-by-points") { sortPlayersByPoints(); renderPlayerEditors(); renderOverall(); } if (event.target.dataset.removePlayer) { data.players.splice(Number(event.target.dataset.removePlayer), 1); renderPlayerEditors(); } if (event.target.id === "generate-password") { const bytes = crypto.getRandomValues(new Uint8Array(9)); $("#new-password").value = Array.from(bytes, byte => byte.toString(36).padStart(2, "0")).join("").slice(0, 12); $("#new-password").type = "text"; $("#toggle-password").textContent = "Hide"; } if (event.target.id === "toggle-password") { const password = $("#new-password"); password.type = password.type === "password" ? "text" : "password"; event.target.textContent = password.type === "password" ? "Show" : "Hide"; } if (event.target.matches("[data-close]")) event.target.closest(".modal").hidden = true; if (event.target.dataset.remove) { await api(`/api/editors/${encodeURIComponent(event.target.dataset.remove)}`, { method:"DELETE" }); await loadEditors(); } });
    $("#player-editor-list").addEventListener("input", event => { if (!event.target.dataset.field) return; const player = data.players[Number(event.target.dataset.player)]; player[event.target.dataset.field] = event.target.dataset.field === "points" ? calculatePoints(player) : event.target.value; if (modeKeys.includes(event.target.dataset.field)) { player.points = calculatePoints(player); const pointsField = $("[data-player='" + event.target.dataset.player + "'][data-field='points']"); if (pointsField) pointsField.value = player.points; } });
    $("#login-form").addEventListener("submit", async event => { event.preventDefault(); try { const result = await api("/api/login", { method:"POST", body:JSON.stringify({ username:$("#username").value, password:$("#password").value }) }); currentUser = result.user; $("#login-modal").hidden = true; event.target.reset(); renderAccount(); } catch (error) { $("#login-message").textContent = error.message; } });
    $("#editor-form").addEventListener("submit", async event => { event.preventDefault(); const username = $("#new-username").value.trim(); const password = $("#new-password").value; try { await api("/api/editors", { method:"POST", body:JSON.stringify({ username, password }) }); event.target.reset(); $("#new-password").type = "password"; $("#toggle-password").textContent = "Show"; $("#manage-message").className = "message success"; $("#manage-message").textContent = `Editor ${username} added. Temporary password: ${password}`; await loadEditors(); } catch (error) { $("#manage-message").className = "message"; $("#manage-message").textContent = error.message; } });
    $("#admin-password-form").addEventListener("submit", async event => { event.preventDefault(); try { await api("/api/me/password", { method:"PATCH", body:JSON.stringify({ currentPassword:$("#current-admin-password").value, newPassword:$("#new-admin-password").value }) }); event.target.reset(); $("#manage-message").className = "message success"; $("#manage-message").textContent = "Admin password changed."; } catch (error) { $("#manage-message").className = "message"; $("#manage-message").textContent = error.message; } });
    $("#editor-list").addEventListener("submit", async event => { if (!event.target.matches(".reset-form")) return; event.preventDefault(); const username = event.target.dataset.resetPassword; const password = event.target.querySelector("input").value; try { await api(`/api/accounts/${encodeURIComponent(username)}/password`, { method:"PATCH", body:JSON.stringify({ password }) }); event.target.reset(); $("#manage-message").className = "message success"; $("#manage-message").textContent = `Password reset for ${username}.`; } catch (error) { $("#manage-message").className = "message"; $("#manage-message").textContent = error.message; } });
    $("#save-data").addEventListener("click", async () => { try { const advanced = $("#data-editor").closest("details").open; if (advanced) data = JSON.parse($("#data-editor").value); recalculatePoints(); if ($("#sort-by-points").checked) sortPlayersByPoints(); const json = JSON.stringify(data, null, 2); $("#data-editor").value = json; renderPlayerEditors(); renderOverall(); await navigator.clipboard.writeText(json); $("#manage-message").className = "message success"; $("#manage-message").textContent = "JSON copied. Paste it into data/leaderboards.json in the repo."; } catch (error) { $("#manage-message").className = "message"; $("#manage-message").textContent = error.name === "NotAllowedError" ? "Clipboard access was blocked. Copy the JSON from the advanced editor." : error.message.includes("JSON") ? "Advanced JSON is invalid." : error.message; } });
    (async function init() { try { data = await api("/api/leaderboards"); } catch (error) { data = await api("/data/leaderboards.json"); } recalculatePoints(); try { const session = await api("/api/me"); currentUser = session.user; } catch (error) { currentUser = null; } renderTabs(); renderOverall(); renderAccount(); })();
  </script>
</body>
</html>
